<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div id="splash">
      <img src="/assets/splash.png" alt="BRABIM" />
      <p id="splash-status">Iniciando o motor...</p>
    </div>
    <main class="editor">
      <aside class="fields">
        <label>Largura (m)<input id="width" type="number" step="0.1" value="5" /></label>
        <label>Profundidade (m)<input id="depth" type="number" step="0.1" value="4" /></label>
        <p id="status">iniciando...</p>
      </aside>
      <svg id="plan" viewBox="-6 -5 12 10"></svg>
    </main>
  </body>
</html>
