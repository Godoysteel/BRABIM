name: Publicar GitHub Pages
on:
  push:
    branches: [main]
    paths: ['prototipo/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: prototipo/package-lock.json
      - run: npm ci
        working-directory: prototipo
      - run: npm run build:pages
        working-directory: prototipo
      - run: node --experimental-strip-types scripts/test-room.mjs
        working-directory: prototipo
      - run: node --experimental-strip-types scripts/test-house.mjs
        working-directory: prototipo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototipo/dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

